name: Build Baolaiwu TVBox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create local.properties for pyramid
        run: echo "" > local.properties

      - name: Setup Python 3.8 for pyramid
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Fix pyramid python path
        run: |
          sed -i '/buildPython.*python.exe/d' pyramid/build.gradle
          python -m pip install --upgrade pip
          python -m pip install lxml ujson pyquery requests jsonpath cachetools pycryptodome beautifulsoup4

      - name: Add fallback maven repos
        run: |
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/jitpack.io/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi
          sed -i "/jitpack.io/a\        maven { url 'https://jitpack.io' }" build.gradle || true

      - name: Build With Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --build-cache --parallel --daemon --warning-mode all

      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          for file in `find ~ -name "*.apk" -print`; do
            cp "$file" ${{ github.workspace }}/apk/TVBox_baolaiwu.apk
          done
          ls -la ${{ github.workspace }}/apk/

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_baolaiwu
          path: ${{ github.workspace }}/apk/*.apk
          if-no-files-found: error
