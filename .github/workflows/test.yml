name: Build Baolaiwu TVBox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create local.properties
        run: echo "" > local.properties

      - name: Add fallback maven repos
        run: |
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/jitpack.io/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi

      - name: Build With Gradle
        run: |
          chmod +x gradlew
          if ./gradlew assembleRelease --build-cache --parallel --daemon --warning-mode all 2>&1 | tee gradle-build.log; then
            echo "===== BUILD OK ====="
          else
            echo "===== BUILD FAILED - last 300 lines ====="
            tail -300 gradle-build.log
            # 推送编译错误到老余微信（pushplus）
            ERR_SUMMARY=$(grep -E "error:|FAILED|BUILD FAILED|cannot find|package.*does not exist" gradle-build.log | tail -20 | head -c 1000)
            MSG="[TVBox Build #${{ github.run_number }} FAILED]\n\n${ERR_SUMMARY}\n\ncommit: ${{ github.sha }}"
            curl -s -X POST "http://www.pushplus.plus/send" \
              -H "Content-Type: application/json" \
              -d "{\"token\":\"2f355d00756149338ea8407721d4424e\",\"title\":\"TVBox Build Failed\",\"content\":\"$(echo "$MSG" | sed 's/"/\\"/g')\",\"template\":\"txt\"}" \
              || echo "pushplus notify failed (non-critical)"
            exit 1
          fi

      - name: Upload Build Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-build.log

      - name: Build Success Notify
        if: success()
        run: |
          APK_EXISTS=$(ls ${{ github.workspace }}/apk/TVBox_baolaiwu.apk 2>/dev/null || echo "none")
          if [ "$APK_EXISTS" != "none" ]; then
            curl -s -X POST "http://www.pushplus.plus/send" \
              -H "Content-Type: application/json" \
              -d '{"token":"2f355d00756149338ea8407721d4424e","title":"TVBox Build OK","content":"Build #'${{ github.run_number }}' 成功，commit '${{ github.sha }}'。去 Actions 页面下载 APK。","template":"txt"}' \
              || echo "pushplus notify failed (non-critical)"
          else
            curl -s -X POST "http://www.pushplus.plus/send" \
              -H "Content-Type: application/json" \
              -d '{"token":"2f355d00756149338ea8407721d4424e","title":"TVBox Build 编译成功但无APK","content":"Build #'${{ github.run_number }}' Gradle 编译通过但未找到 APK 文件，请检查 Actions 日志的 Prepare App 步骤。","template":"txt"}' \
              || echo "pushplus notify failed (non-critical)"
          fi

      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          # 1) 先搜标准 Gradle 输出目录
          find ${{ github.workspace }}/app -name "*.apk" -type f -print 2>/dev/null || true
          # 2) 再搜 home 目录（兜底）
          find ~ -name "*.apk" -type f -print 2>/dev/null || true
          # 复制所有找到的 APK
          for file in $(find ${{ github.workspace }}/app ~ -name "*.apk" -type f 2>/dev/null | sort -u); do
            cp "$file" ${{ github.workspace }}/apk/TVBox_baolaiwu.apk
            echo "Copied: $file"
          done
          # 列出结果
          ls -la ${{ github.workspace }}/apk/
          if [ ! -f ${{ github.workspace }}/apk/TVBox_baolaiwu.apk ]; then
            echo "ERROR: No APK found in app/ or ~/"
            exit 1
          fi

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_baolaiwu
          path: ${{ github.workspace }}/apk/*.apk
          if-no-files-found: error
