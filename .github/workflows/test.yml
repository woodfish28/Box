name: Build Baolaiwu TVBox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create local.properties
        run: echo "" > local.properties

      - name: Add fallback maven repos
        run: |
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/jitpack.io/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi

      - name: Build With Gradle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --build-cache --parallel --daemon --warning-mode all 2>&1 | tee gradle-build.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "===== BUILD FAILED ====="
            tail -150 gradle-build.log
            exit 1
          fi

      - name: Upload Build Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-build.log

      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          for file in `find ~ -name "*.apk" -print`; do
            cp "$file" ${{ github.workspace }}/apk/TVBox_baolaiwu.apk
          done
          ls -la ${{ github.workspace }}/apk/

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_baolaiwu
          path: ${{ github.workspace }}/apk/*.apk
          if-no-files-found: error
