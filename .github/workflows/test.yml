name: Build Baolaiwu TVBox

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create local.properties
        run: echo "" > local.properties

      - name: Add fallback maven repos
        run: |
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/jitpack.io/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi

      - name: Build With Gradle
        run: |
          chmod +x gradlew
          echo "Starting Gradle build, this may take 5-10 minutes..."
          ./gradlew assembleRelease --build-cache --parallel --daemon --warning-mode all > gradle-build.log 2>&1
          GRADLE_EXIT=$?
          echo "Gradle exit code: $GRADLE_EXIT"
          echo "Gradle log size: $(wc -c < gradle-build.log 2>/dev/null || echo 0) bytes"
          if [ $GRADLE_EXIT -eq 0 ]; then
            echo "===== BUILD OK (exit 0) ====="
            echo "=== APK location check ==="
            find app/build/outputs/apk -name "*.apk" -type f -print 2>/dev/null || echo "No APK in expected location"
            echo "=== Build log tail ==="
            tail -30 gradle-build.log
          else
            echo "===== BUILD FAILED (exit $GRADLE_EXIT) ====="
            echo "=== Last 200 lines of build log ==="
            tail -200 gradle-build.log
            echo "=== Error summary ==="
            grep -E "error:|FAILED|BUILD FAILED|cannot find|package.*does not exist|Execution failed|Could not" gradle-build.log | tail -30 | head -c 2000
            curl -s -X POST "http://www.pushplus.plus/send" \
              -H "Content-Type: application/json" \
              -d "{\"token\":\"2f355d00756149338ea8407721d4424e\",\"title\":\"TVBox Build #${{ github.run_number }} FAILED\",\"content\":\"exit=$GRADLE_EXIT, log=$(wc -c < gradle-build.log 2>/dev/null || echo 0)bytes\\ncommit: ${{ github.sha }}\\n请查看 build-log artifact 定位编译错误\",\"template\":\"txt\"}" \
              || echo "pushplus notify failed"
            exit 1
          fi

      - name: Upload Build Log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-build.log

      - name: Prepare App
        run: |
          mkdir -p ${{ github.workspace }}/apk/
          echo "=== APK search (explicit gradle output) ==="
          find app/build/outputs/apk -name "*.apk" -type f -print 2>/dev/null
          for file in $(find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null | sort -u); do
            cp "$file" ${{ github.workspace }}/apk/TVBox_baolaiwu.apk
            echo "Copied: $file"
          done
          if [ ! -f ${{ github.workspace }}/apk/TVBox_baolaiwu.apk ]; then
            echo "FALLBACK: APK not in gradle output, searching entire workspace..."
            find . -name "*.apk" -type f -print 2>/dev/null
            for file in $(find . -name "*.apk" -type f 2>/dev/null | sort -u); do
              cp "$file" ${{ github.workspace }}/apk/TVBox_baolaiwu.apk
              echo "Copied (fallback): $file"
            done
          fi
          ls -la ${{ github.workspace }}/apk/
          if [ ! -f ${{ github.workspace }}/apk/TVBox_baolaiwu.apk ]; then
            echo "ERROR: No APK found"
            exit 1
          fi

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox_baolaiwu
          path: ${{ github.workspace }}/apk/*.apk
          if-no-files-found: error

      - name: Build Result Notify
        if: success()
        run: |
          curl -s -X POST "http://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"2f355d00756149338ea8407721d4424e\",\"title\":\"TVBox Build #${{ github.run_number }} OK\",\"content\":\"Build #${{ github.run_number }} 成功，commit ${{ github.sha }}。去 Actions 页面下载 APK。\",\"template\":\"txt\"}" \
            || echo "pushplus notify failed"
